name: YOLO
server:
  cut-layer: a # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: True   #False
  # adaptive: per-batch routing — a free slot_queue permit → full cloud YOLO
  #           (path 'split'); no permit → full edge YOLO, bboxes via bbox_queue
  #           (path 'edge_only'). No model split. Permit count is derived from
  #           the broker RAM budget below.
  mode: adaptive
  #mode: only_cloud
  #mode: only_edge
rabbit:
  # address: localhost
  # username: guest
  # password: guest
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /
  # ---- a: max messages resident in one cloud's work queue -----------------
  # Measured in WHOLE raw-frame batch messages, and it may be fractional.
  # src/Utils.transport_plan turns it into the queue geometry:
  #
  #   a = 2     2 full batch messages resident      2 x 150 = 300 MiB per queue
  #   a = 1     1 full batch message                      150 MiB per queue
  #   a = 0.5   batch cut into 2 chunks, 1 resident        75 MiB per queue
  #   a = 0.25  batch cut into 4 chunks, 1 resident        37 MiB per queue
  #
  # a >= 1 keeps one message per batch and caps the queue at floor(a). a < 1
  # cannot be expressed as a message count, so the MESSAGE is made smaller
  # instead: the batch is cut into ceil(1/a) chunks and the queue holds one.
  # ceil rounds the resident payload down, never up (a = 0.6 -> 2 chunks -> 0.5
  # batches), so a is a bound that is undershot, not exceeded.
  #
  # Chunks are labelled in the AMQP headers (batch_key, chunk_index, chunk_total)
  # and merged by the cloud BEFORE inference, so a batch is still one unit of
  # work however many messages carried it — latency, e2e, FPS and mAP accounting
  # do not change with a.
  #
  # a is per QUEUE, and each cloud has its own work queue (the merge needs every
  # chunk of a batch to reach the same consumer), so the broker holds up to
  #   clients[1] x a x batch_body     = 3 x 0.5 x 150 MiB = 225 MiB at a = 0.5.
  # The server prints the arithmetic it computed as a [Slots] line at startup —
  # read it there, not here.
  #
  # a is also the size of each queue's slot_queue permit pool. The permit, not
  # x-max-length, is what actually bounds RAM: x-max-length is evaluated only
  # after the broker has received a body in full, so without permits all 9 edges
  # can each push a complete message before any one is rejected. The permit is
  # taken BEFORE transmitting.
  #
  # a and server.batch-size MUST be identical in every machine's config.yaml:
  # both feed queue arguments, and a queue_declare with different arguments is a
  # PRECONDITION_FAILED that kills the channel.
  #
  # This is NOT the last line of defence — set vm_memory_high_watermark.absolute
  # on the broker too, since that holds even when a client misbehaves.
  max-queue-messages: 0.5
  #
  # Overflow policy for a queue that hits its cap: the broker rejects further
  # publishes and NACKs the edge, which waits for the cloud to drain and retries
  # — no message lost.
  # bbox_queue: light, carries edge-computed bboxes (~KB text), so its cap can be
  #   far deeper than the image queue's for the same RAM. Falls back to a if unset.
  bbox-max-queue-messages: 20
  overflow: reject-publish

debug-mode: False
data: videohungyen.mp4
log-path: .

fps:                      # optional; defaults shown
  grace_s: 10             # keep collecting DONEs this long after the work queues drain
  shutdown_timeout_s: 300 # hard cap so a dead worker can't hang the server
compress:
  enable: False
  num_bit: 8

clustering:
  enable: False         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 100.0
  measure_bandwidth: True # True → đo thực tế mỗi lần chạy; False → dùng network_rate_mb_s cố định
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập