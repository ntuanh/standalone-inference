name: YOLO
server:
  cut-layer: a # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: True   #False
  # adaptive: per-batch routing — a free slot_queue permit → full cloud YOLO
  #           (path 'split'); no permit → full edge YOLO, bboxes via bbox_queue
  #           (path 'edge_only'). No model split. Permit count comes from
  #           rabbit.max-queue-messages.
  mode: adaptive
  #mode: only_cloud
  #mode: only_edge
rabbit:
  # address: localhost
  # username: guest
  # password: guest
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /
  # Broker-level overflow protection (x-overflow: reject-publish). When a queue
  # hits its cap the broker rejects further publishes and NACKs the edge, which
  # waits for the cloud to drain and retries — no message lost, broker RAM bounded.
  # Set a cap to 0 / remove to disable that queue's limit.
  #
  # intermediate_queue: heavy, carries raw image batches (~150 MB each at
  #   batch-size 32). This value does triple duty — it is the queue's
  #   x-max-length, the size of the slot_queue permit pool every edge must draw
  #   from before transmitting a raw-frame batch, AND slot_queue's own cap so
  #   that pool can never over-fill. The permit is what actually bounds broker
  #   RAM: x-max-length is evaluated only after the broker has received a body
  #   in full, so without permits all 9 edges can each push a complete 150 MB
  #   message before any one of them is rejected (~1.3 GB).
  #
  #   Peak broker RAM ≈ max-queue-messages × per-message size:
  #     1 -> 150 MB     2 -> 300 MB     3 -> 450 MB     4 -> 600 MB
  #   plus ~150-300 MB for the RabbitMQ base and the management plugin. This is
  #   NOT the last line of defence — set vm_memory_high_watermark.absolute on
  #   the broker too, since that holds even when a client misbehaves.
  max-queue-messages: 2
  # bbox_queue: light, carries edge-computed bboxes (~KB text). Cap can be deep.
  #   If unset, falls back to max-queue-messages.
  bbox-max-queue-messages: 20
  overflow: reject-publish

debug-mode: False
data: videohungyen.mp4
log-path: .

fps:                      # optional; defaults shown
  grace_s: 10             # keep collecting DONEs this long after the work queues drain
  shutdown_timeout_s: 300 # hard cap so a dead worker can't hang the server
compress:
  enable: False
  num_bit: 8

clustering:
  enable: False         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 100.0
  measure_bandwidth: True # True → đo thực tế mỗi lần chạy; False → dùng network_rate_mb_s cố định
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập