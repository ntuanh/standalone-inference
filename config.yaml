name: YOLO
server:
  cut-layer: a # or b, c, d
  clients:
    - 9 #edge
    - 3 #cloud
  model: yolo26n
  batch-size: 32
experiment:
  enable: True   #False
  # adaptive: per-batch routing — a free slot_queue permit → full cloud YOLO
  #           (path 'split'); no permit → full edge YOLO, bboxes via bbox_queue
  #           (path 'edge_only'). No model split. Permit count is derived from
  #           the broker RAM budget below.
  mode: adaptive
  #mode: only_cloud
  #mode: only_edge
rabbit:
  # address: localhost
  # username: guest
  # password: guest
  address: 192.168.101.91
  username: "machine-1"
  password: "123456"
  virtual-host: /
  # ---- Broker RAM budget -------------------------------------------------
  # The knob is RAM, not a message count. src/Utils.raw_frame_transport_plan
  # turns these two numbers into how many raw-frame batches may be resident in
  # the broker at once (N), and N is used three ways: intermediate_queue's
  # x-max-length, the size of the slot_queue permit pool an edge must draw from
  # before it transmits, and slot_queue's own cap so the pool cannot over-fill.
  #
  # The permit is what actually bounds RAM. x-max-length is evaluated only after
  # the broker has received a body in full, so without permits all 9 edges can
  # each push a complete 150 MiB message before any one is rejected (~1.3 GB).
  # A permit is taken BEFORE transmitting, so peak resident bodies is N, never 9.
  #
  #   body       = batch-size x 640x640x3 float32          (32 -> 150 MiB)
  #   accounted  = body x 1.2   (broker frame-assembly + per-message overhead)
  #   N          = (budget - reserve) / accounted          (32 -> 4)
  #   peak host  = N x accounted + reserve                 (32 -> 1020 MiB)
  #
  # At batch-size 32: 4 permits, peak ~720 MiB of bodies + 300 MiB reserve, so
  # the host stays under the 1024 MB budget. The server prints the arithmetic it
  # computed as a [Slots] line at startup — check it there, not here.
  #
  # These keys and server.batch-size MUST be identical in every machine's
  # config.yaml: N becomes a queue argument, and a queue_declare with different
  # arguments is a PRECONDITION_FAILED that kills the channel.
  #
  # This is NOT the last line of defence — set vm_memory_high_watermark.absolute
  # on the broker too, since that holds even when a client misbehaves.
  broker-ram-budget-mb: 1024   # ceiling for the whole broker host
  broker-ram-reserve-mb: 300   # RabbitMQ base + management plugin, before payload
  # Optional manual ceiling on N. Can only LOWER what the budget allows, so it
  # is not a way to opt out of the budget. Leave unset to use the full budget.
  # max-queue-messages: 2
  #
  # Overflow policy for a queue that hits its cap: the broker rejects further
  # publishes and NACKs the edge, which waits for the cloud to drain and retries
  # — no message lost.
  # bbox_queue: light, carries edge-computed bboxes (~KB text), so its cap can be
  #   far deeper than the image queue's for the same RAM. Falls back to N if unset.
  bbox-max-queue-messages: 20
  overflow: reject-publish

debug-mode: False
data: videohungyen.mp4
log-path: .

fps:                      # optional; defaults shown
  grace_s: 10             # keep collecting DONEs this long after the work queues drain
  shutdown_timeout_s: 300 # hard cap so a dead worker can't hang the server
compress:
  enable: False
  num_bit: 8

clustering:
  enable: False         # True → Hungarian tự chọn cut point; False → dùng cut-layer cố định
  num_A: 3              # num_A + num_B + num_C = clients[0] (tổng edge)
  num_B: 3
  num_C: 3
  num_cloud: 3         # = clients[1] (tổng cloud)
  max_clusters: 3      # <= min(clients[0], clients[1])
  network_rate_mb_s: 100.0
  measure_bandwidth: True # True → đo thực tế mỗi lần chạy; False → dùng network_rate_mb_s cố định
  profile_source: real     # auto → dùng real nếu có, không thì simulated; real → ép dùng real; simulated → ép dùng giả lập